name: Bug report
description: Report a reproducible YaverVoice desktop problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private audio, transcripts, or secret-bearing logs. Security issues must be reported through the Security tab."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0-beta.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Windows 10/11", "Linux", "Other"]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Start from source..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Relevant sanitized output
      description: Remove credentials, file paths, personal data, audio, and transcripts.
